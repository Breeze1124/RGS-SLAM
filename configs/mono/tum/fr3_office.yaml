inherit_from: "configs/mono/tum/base_config.yaml"

Dataset:
  dataset_path: "datasets/tum/rgbd_dataset_freiburg3_long_office_household"
  Calibration:
    fx: 535.4
    fy: 539.2
    cx: 320.1
    cy: 247.6
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0
    k3: 0.0
    width: 640
    height: 480
    depth_scale: 5000.0
    distorted: False

EDGS:
  use: True
  matches_per_ref: 200
  num_refs: 1
  nns_per_ref: 3
  scaling_factor: 0.001
  proj_err_tolerance: 0.01
  roma_model: "indoors"  # 或 "indoor"
  add_SfM_init: False
  scale_factor: 0.8
  verbose: False